id: D142
series: D
description: "E4075: str.matches no longer pastes ^( )$ around the pattern, so an unbalanced a)(b is an error, not ^(a)(b)$ (137.9)"
input: |
  m=test;
  i=str:std.str;
  f=main():i64{
    <str.matches("ab";"a)(b")
  };
expected_exit_code: 1
expected_error_codes: ["E4075"]
expected_fix_absent: true
expected_diag_field:
  field: expected
  value: "a pattern in toke's regex language (docs/stdlib/str.md, Regular expressions)"
