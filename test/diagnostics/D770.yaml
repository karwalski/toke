id: D770
series: D
description: "127.526: a str assigned to a module-level mut inside an {arena} block, nested in an if and a loop, is E5001 at --check, with no fix (the repair depends on the program)"
input: |
  m=test;
  let g=mut."";
  f=keep(c:bool):i64{
    {arena
      if(c){
        lp(let i=0;i<2;i=i+1){
          g="k\(i)"
        }
      }
    };
    <0
  };
expected_exit_code: 1
expected_error_codes: ["E5001"]
expected_fix_absent: true
expected_diag_field:
  field: got
  value: "str"
