id: D551
series: D
description: "127.438: bitwise NOT on an f64 (`~x`) is E4031 with no fix -- the fix field restated the error, it was not a repair (AGENTS 6, errors.md E4031)"
input: |
  m=t;
  f=main():i64{
    let x=1.5;
    let n=~x;
    <0
  };
expected_exit_code: 1
expected_error_codes: ["E4031"]
expected_fix_absent: true
expected_diag_field:
  field: got
  value: "f64"
