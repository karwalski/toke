id: D627
series: D
description: "138.35 (T-67): an integer other than the literal 0 passed to a user parameter declared $handle is E4031 with NO fix"
input: |
  m=t;
  i=process:std.process;
  f=waith(h:$handle):i64{
    <process.wait(h) as i64
  };
  f=main():i64{
    <waith(7)
  };
