id: D065
series: D
description: "lint single-use-let: a pure initialiser used once in the next statement is a hint with an inline fix; --fix inlines (parenthesised where needed) and deletes the let. 131.59: `let q=arr.len` is NOT inlined -- the binding is an untyped (i64) local while `arr.len` is u64, so `q-1` and `arr.len-1` are different operations (signed vs unsigned-with-overflow); the literal `3` is inlined because its sibling `1` is i64"
input: |
  m=t;
  f=dbl(x:i64):i64{<x*2};
  f=main():i64{
    let a=3;
    let n=a+1;
    let r=dbl(n);
    let arr=@(1;2;3);
    let q=arr.len;
    let z=arr.get(q-1);
    <r+z
  };
flags: --lint
expected_exit_code: 0
expected_error_codes: ["single-use-let"]
expected_fixed_output: |
  m=t;
  f=dbl(x:i64):i64{<x*2};
  f=main():i64{
    let r=dbl(3+1);
    let arr=@(1;2;3);
    let q=arr.len;
    <r+arr.get(q-1)
  };
