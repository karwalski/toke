id: D587
series: D
description: "127.319: a std T!E used as an array index is E4031 with NO fix -- the cast fix ('cast index to i64 or u64 using as') would be wrong for a union, which `as` does not unwrap"
input: |
  m=t;
  i=str:std.str;
  f=main():i64{
    let a=@(10;20;30);
    let v=a.get(str.toint("1"));
    <v
  };
expected_exit_code: 1
expected_error_codes: ["E4031"]
expected_fix_absent: true
expected_diag_field:
  field: got
  value: "i64!$parseerr"
