id: D112
series: D
description: "E2001 ordering violation carries no fix: the reorder text named no declaration and no target (127.240)"
# The old fix, "reorder declarations: m= first, then i=, t=, f=", left out
# `let` globals and constants, which this very case is about.
input: |
  m=test;
  f=a():i64{<1};
  let g=mut.3;
expected_exit_code: 1
expected_error_codes: ["E2001"]
expected_fix_absent: true
