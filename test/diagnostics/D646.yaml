id: D646
series: D
description: "127.469: a call of a module-level function value is judged against its signature, as a local's is: wrong arity is E4026 with no fix (whether an argument is missing or surplus is not decidable from the call). Before, the call was unchecked and lowered as its argument."
input: |
  m=test;
  let h=fn(x:i64):i64{<x+1};
  f=main():i64{<h(1;2)};
expected_exit_code: 1
expected_error_codes: ["E4026"]
expected_fix_absent: true
