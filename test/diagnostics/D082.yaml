    a.push(1);
    let b:Vec=vv.new();
    b.push(2);
    let c=mut.vv.new();
    c.push(3);
    c.set(0;4);
    if(vv.len(a)>0){a.push(5)};
    <fill(a;4)+vv.len(b)+vv.len(c)
  };
