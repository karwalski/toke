id: D067
series: D
description: "lint single-use-let negative: bindings used twice, used in a later (not next) statement, or declared mut are not flagged"
input: |
  m=t;
  i=io:std.io;
  f=dbl(x:i64):i64{<x*2};
  f=main():i64{
    let a=3;
    let m2=a+a;
    let p=a+2;
    let x=mut.0;
    x=p;
    let r=dbl(m2);
    io.println("\(x)");
    <r
  };
flags: --lint
expected_exit_code: 0
expected_absent_codes: ["single-use-let"]
