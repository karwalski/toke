id: D640
series: D
description: "138.39 (T-39): an import used only as a struct-field type (`t=$h{rs:@$csvreader}`, the record unqualified) is not unused-import, and --fix leaves the file unchanged -- deleting it is E3011 on the next check"
input: |
  m=t;
  i=c:std.csv;
  t=$h{rs:@$csvreader;k:i64};
  f=main():i64{<0};
flags: --lint
expected_exit_code: 0
expected_absent_codes: ["unused-import"]
expected_fixed_output: |
  m=t;
  i=c:std.csv;
  t=$h{rs:@$csvreader;k:i64};
  f=main():i64{<0};
