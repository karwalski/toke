id: D062
series: D
description: "lint string-concat-chain: with TKC_LINT_CONCAT_FIX=1 and plain ident/literal leaves, --fix rewrites the chain to one interpolated literal (module and method style)"
input: |
  m=t;
  i=s:std.str;
  f=main():i64{
    let a="a";
    let b="b";
    let c=s.concat("x=";s.concat(a;s.concat(", y=";b)));
    let d=a.concat(b).concat("z");
    <s.len(c)+s.len(d)
  };
flags: --lint
env: TKC_LINT_CONCAT_FIX=1
expected_exit_code: 0
expected_error_codes: ["string-concat-chain"]
expected_fixed_output: |
  m=t;
  i=s:std.str;
  f=main():i64{
    let a="a";
    let b="b";
    let c="x=\(a), y=\(b)";
    let d="\(a)\(b)z";
    <s.len(c)+s.len(d)
  };
