id: D581
series: D
description: "127.323: a std T!E interpolated into a string (\"\\(str.toint(s))\") is E4031 with no fix -- rejected, not printed (register 1.1)"
input: |
  m=t;
  i=io:std.io;
  i=str:std.str;
  f=main():i64{
    let n=str.toint("3");
    io.println("n=\(n)");
    <0
  };
expected_exit_code: 1
expected_error_codes: ["E4031"]
expected_fix_absent: true
expected_diag_field:
  field: got
  value: "i64!$parseerr"
