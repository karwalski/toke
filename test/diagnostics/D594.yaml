id: D594
series: D
description: "127.462: the receiver spelling t.slice(a;b) of the fallible str.slice, passed to io.println, is E4031 with NO fix -- it lowers to the same error-slot glue and is the same union str!$sliceerr"
input: |
  m=t;
  i=io:std.io;
