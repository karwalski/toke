id: D639
series: D
description: "127.474: `+` with an error-union operand and a str operand names each side's type -- it said 'both sides are' the left type, so a repair of one side met an E4031 it was not told of; no fix"
input: |
  m=test;
  i=str:std.str;
  f=main():i64{
    let t="abc";
    let x="z"+str.slice(t;0;1);
    <0
