id: D073
series: D
description: "lint loop-rebuilds-array (hint): a lp whose only statement is acc=acc.append(f(xs.get(i))) is flagged; not fixable"
input: |
  m=t;
  f=dbl(x:i64):i64{<x*2};
  f=main():i64{
    let xs=@(1;2;3);
    let acc=mut.@();
    lp(let i=0;i<xs.len;i=i+1){acc=acc.append(dbl(xs.get(i)))};
    <acc.len
  };
flags: --lint
expected_exit_code: 0
expected_error_codes: ["loop-rebuilds-array"]
expected_fix_absent: true
