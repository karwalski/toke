name: Security nightly

# Story 120.24 (Epic 120): recurring security scanning.
#   * fuzz-120-22    — nightly (03:00 UTC), parser + runtime-WAF fuzzing under
#                      ASAN/UBSAN (harnesses/targets from Story 120.22).
#   * deps-cve-sbom  — weekly (Mon 04:00 UTC), SBOM refresh + grype CVE recheck.
# Each cron fires only its own job (see the `if:` guards); both are also
# runnable on demand via workflow_dispatch. Existing workflows are untouched.
#
# NOTE: the make targets referenced below (fuzz-120-22, fuzz-120-22-run, sbom,
# cve-scan) are specified in docs/security/audit-120/ci-security.md and land in
# a follow-up Makefile change; this workflow goes green once they are merged.

on:
  schedule:
    - cron: '0 3 * * *'    # 03:00 UTC daily — 120.22 fuzzing
    - cron: '0 4 * * 1'    # 04:00 UTC Monday — dependency CVE + SBOM refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-120-22:
    name: 120.22 parser + WAF fuzzing (ASAN/UBSAN)
    runs-on: ubuntu-latest
    # Runs on the nightly cron and on manual dispatch, not on the weekly cron.
    if: github.event.schedule != '0 4 * * 1'
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libcmark-dev

      - name: Build 120.22 fuzz targets
        run: make CC=clang fuzz-120-22

      - name: Run 120.22 fuzzers (120s each, ASAN/UBSAN)
        run: make fuzz-120-22-run

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-120-22-crashes
          path: crash-*

  deps-cve-sbom:
    name: Dependency CVE recheck + SBOM refresh
    runs-on: ubuntu-latest
    # Runs on the weekly cron and on manual dispatch, not on the nightly cron.
    if: github.event.schedule != '0 3 * * *'
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev llvm-dev clang

      - name: Build tkc
        run: make

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Refresh SBOM
        run: make sbom

      - name: CVE recheck (fail on High/Critical)
        run: make cve-scan

      - name: Upload refreshed SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkc-sbom-${{ github.sha }}
          path: |
            tkc-sbom.spdx.json
            tkc-sbom.spdx.json.sha256
