name: Security nightly

# Story 120.24 (Epic 120): recurring security scanning.
#   * deps-cve-sbom — weekly (Mon 04:00 UTC), SBOM refresh + grype CVE recheck.
# Also runnable on demand via workflow_dispatch. Existing workflows untouched.
#
# 123.10a (2026-09-22): this workflow shipped calling four make targets that
# did not exist — fuzz-120-22, fuzz-120-22-run, sbom, cve-scan — with a note
# saying they would "land in a follow-up Makefile change". They never did, so
# the nightly was red by construction and failing for a reason unrelated to
# security: output people learn to ignore.
#
# sbom and cve-scan now exist in the Makefile (Section 3 of
# docs/security/audit-120/ci-security.md specifies them completely), so the
# weekly job below is real and can go red only for a real finding.
#
# 123.10: the nightly 120.22 fuzz job is BACK, in the same change that landed
# its targets.  (123.10a had removed it rather than leave it red: it called
# fuzz-120-22 / fuzz-120-22-run, which did not exist, and Section 2 of
# ci-security.md named harnesses -- fuzz_md.c, fuzz_security.c -- that do not
# exist either.)  The targets now build the nine harnesses that DO exist
# (json, multipart, template, toml, toon, ws_frame, xml, yaml; image joined
# in 122.13) in libFuzzer
# mode on this Linux runner, fuzz each for FUZZ_SECONDS from the tracked seeds
# in test/fuzz/seeds/<target>/, and minimise what they found into
# build/fuzz/corpus-min/, uploaded below.  The job asserts the engine really
# is libFuzzer: on a runner without it the Makefile would fall back to a
# corpus replay, and a replay reported as a fuzz run is the thing to prevent.

on:
  schedule:
    - cron: '0 3 * * *'    # 03:00 UTC daily — 120.22 fuzz targets (123.10)
    - cron: '0 4 * * 1'    # 04:00 UTC Monday — dependency CVE + SBOM refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-120-22:
    name: Fuzz the 120.22 stdlib parser harnesses (ASAN+UBSAN)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev clang

      # A replay is not a fuzz run. Fail here if the libFuzzer runtime is
      # missing rather than let `auto` fall back to standalone replay.
      - name: Build the nine harnesses in libFuzzer mode
        run: make CC=clang FUZZ_ENGINE=libfuzzer fuzz-120-22

      - name: Replay seeds and adversarial regressions
        run: make CC=clang FUZZ_ENGINE=libfuzzer fuzz-smoke

      - name: Fuzz each target (FUZZ_SECONDS each), then minimise
        run: make CC=clang FUZZ_ENGINE=libfuzzer FUZZ_SECONDS=300 fuzz-120-22-run

      - name: Upload crashes and the minimised corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-120-22-${{ github.sha }}
          path: |
            build/fuzz/crash-*
            build/fuzz/corpus-min/
          if-no-files-found: ignore

  deps-cve-sbom:
    name: Dependency CVE recheck + SBOM refresh
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev llvm-dev clang

      - name: Build tkc
        run: make

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Refresh SBOM
        run: make sbom

      - name: CVE recheck (fail on High/Critical)
        run: make cve-scan

      - name: Upload refreshed SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkc-sbom-${{ github.sha }}
          path: |
            tkc-sbom.spdx.json
            tkc-sbom.spdx.json.sha256
