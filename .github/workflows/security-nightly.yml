name: Security nightly

# Story 120.24 (Epic 120): recurring security scanning.
#   * deps-cve-sbom — weekly (Mon 04:00 UTC), SBOM refresh + grype CVE recheck.
# Also runnable on demand via workflow_dispatch. Existing workflows untouched.
#
# 123.10a (2026-09-22): this workflow shipped calling four make targets that
# did not exist — fuzz-120-22, fuzz-120-22-run, sbom, cve-scan — with a note
# saying they would "land in a follow-up Makefile change". They never did, so
# the nightly was red by construction and failing for a reason unrelated to
# security: output people learn to ignore.
#
# sbom and cve-scan now exist in the Makefile (Section 3 of
# docs/security/audit-120/ci-security.md specifies them completely), so the
# weekly job below is real and can go red only for a real finding.
#
# The nightly 120.22 fuzz job is REMOVED rather than left failing, because it
# cannot be made to pass without work that Story 123.10 owns. Section 2 of
# ci-security.md is stale: its paste-ready text builds test/fuzz/fuzz_md.c and
# fuzz_security.c, NEITHER OF WHICH EXISTS, omits four harnesses that do
# (multipart, template, toml, ws_frame), and points its runners at
# test/fuzz/corpus/<format>/ subdirectories that do not exist either — the
# corpus directory holds .tk files. Adding those targets verbatim would leave
# the job just as red.
#
# 123.10 already owns the 8 orphaned fuzz harnesses (json, multipart,
# template, toml, toon, ws_frame, xml, yaml — exactly the set with no Makefile
# rule). Re-add this job there, in the same change that lands the targets,
# corpora and a corrected Section 2, so the workflow and the harnesses arrive
# together and the result means something on day one.

on:
  schedule:
    - cron: '0 4 * * 1'    # 04:00 UTC Monday — dependency CVE + SBOM refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps-cve-sbom:
    name: Dependency CVE recheck + SBOM refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev llvm-dev clang

      - name: Build tkc
        run: make

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Refresh SBOM
        run: make sbom

      - name: CVE recheck (fail on High/Critical)
        run: make cve-scan

      - name: Upload refreshed SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkc-sbom-${{ github.sha }}
          path: |
            tkc-sbom.spdx.json
            tkc-sbom.spdx.json.sha256
