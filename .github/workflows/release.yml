name: Release

on:
  push:
    tags:
      - 'v*'
  # 127.439: the build matrix (conform + the -Werror release build + packaging
  # on all four platforms) also runs on a pull request and on demand, so a
  # release blocker is found before a tag rather than by one.  Nothing is
  # signed, published or released on these events: the `release` job's
  # signing and publishing steps, and the tag/VERSION check, run only on a
  # refs/tags/v* ref (each carries its own `if:` below).
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign_test:
        # 127.453: a dispatch runs the whole release job except publishing.
        # With sign_test it also signs the archives keyless, verifies each
        # bundle and runs the tamper test, so the signing path is proven
        # before a tag. Keyless signing writes an entry to the public Rekor
        # transparency log naming this workflow and ref; nothing else leaves
        # the run (the signed set is a workflow artifact, kept one day).
        description: "also sign + verify the archives (writes a Rekor log entry; publishes nothing)"
        type: boolean
        default: false

# Least privilege by default; the release job asks for what it needs.
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Build matrix: compile tkc on every target platform and package release
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - target: macos-arm64
            # 127.439: macos-14 is no longer offered ("The configuration
            # 'macos-14-arm64-us-default' is not supported"; the job is
            # cancelled in one second).  macos-15 is the arm64 image.
            runner: macos-15
            os: macos
            arch: arm64
          - target: macos-x86_64
            # macos-13 images were retired by GitHub (December 2025); a job
            # asking for one never starts, and `release` needs every build.
            # macos-15-intel is the x86_64 image that replaced it (138.17).
            runner: macos-15-intel
            os: macos
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      # 127.439: a tag that does not match VERSION would publish a binary
      # whose `tkc --version` names another release.
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      # 127.439: `make conform` runs the compiler it finds and does not build
      # one ("conform: no compiler at .../tkc (run 'make' first)"), so this
      # gate failed on every platform before testing anything.
      - name: Build tkc
        run: make -k   # -k: report every failing object, not just the first

      - name: Conformance gate
        run: make conform

      # 127.490: the release binary is built in a pristine worktree of the
      # same commit, not in place.  In place, the next `make` (the website
      # check below, whose target depends on the binary) saw the build flags
      # change back and rebuilt it with the development flags, so the 3.2.0
      # archives shipped that rebuild: the runner's absolute stdlib path baked
      # in, no -DNDEBUG.  Nothing else builds in this tree.

      - name: Build release binary
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          TKC_GIT_SHA="$(git rev-parse --short=12 HEAD)"
          TKC_GIT_DIRTY=0
          export SOURCE_DATE_EPOCH TKC_GIT_SHA TKC_GIT_DIRTY
          REL="$RUNNER_TEMP/rel"
          git worktree add --detach "$REL" HEAD
          echo "REL=$REL" >> "$GITHUB_ENV"
          # 127.179: a RELATIVE TKC_STDLIB_DIR is resolved against the directory
          # of the tkc executable (the tarball puts src/stdlib beside tkc), not
          # the caller's cwd, so a released tkc works from any directory.
          # 127.439: the release build is the Makefile's own flag set plus
          # these, not a replacement CFLAGS.  The old replacement dropped the
          # 123.9 hardening flags (the shipped binary had none) and the
          # -Wno-format-truncation policy (gcc 15 then failed the build).
          make -C "$REL" BAKED_STDLIB_DIR=src/stdlib EXTRA_CFLAGS="-DNDEBUG -g0"
          "$REL/toke" --version

      - name: Package release tarball
        run: |
          # On a tag the version is the tag; on a pull request or a manual
          # run (127.439) GITHUB_REF_NAME is e.g. "12/merge", so the
          # tarball is named for VERSION and the commit instead.
          case "${GITHUB_REF}" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME}" ;;
            *)            VERSION="v$(cat VERSION)-ci.$(git rev-parse --short HEAD)" ;;
          esac
          STAGING="tkc-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "${STAGING}/src/stdlib"
          mkdir -p "${STAGING}/stdlib/vendor"

          # Compiler binary: the release build (127.490), not ./toke
          cp "$REL/toke" "${STAGING}/tkc"
          chmod +x "${STAGING}/tkc"

          # stdlib C sources (needed for linking user programs)
          cp src/stdlib/*.c src/stdlib/*.h "${STAGING}/src/stdlib/" 2>/dev/null || true

          # stdlib .tki interface files
          cp stdlib/*.tki "${STAGING}/stdlib/" 2>/dev/null || true

          # Vendor sources (cmark, tomlc99, miniz). Copy the whole tree so a
          # newly vendored library cannot be left out again (132.73: miniz was
          # missing, so a std.zip program could not build from a release).
          cp -r stdlib/vendor/. "${STAGING}/stdlib/vendor/"
          for v in cmark tomlc99 miniz; do
            test -d "${STAGING}/stdlib/vendor/$v" || { echo "vendor/$v missing from the tarball"; exit 1; }
          done

          # LICENSE and NOTICE -- the vendored licences require their
          # attributions to travel with the binaries (132.35).  The stdlib
          # sources shipped above are MIT (135.15a): NOTICE points at
          # LICENSING.md, and stdlib/LICENSE is the MIT text (138.17).
          cp LICENSE NOTICE LICENSING.md "${STAGING}/"
          cp stdlib/LICENSE "${STAGING}/stdlib/LICENSE"

          tar czf "${STAGING}.tar.gz" "${STAGING}"
          echo "TARBALL=${STAGING}.tar.gz" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=tkc-${{ matrix.target }}" >> "$GITHUB_ENV"

      # 132.43 — a tag is what makes a compiler public, and v3.0.0 shipped a
      # compiler under which programs the website publishes no longer
      # compiled. This is the release-ritual closure the tracker names as the
      # one that would have caught it: the tag fails instead.
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          repository: karwalski/toke-web
          path: .site

      # 127.490: run against the tkc UNPACKED FROM THE TARBALL, the bytes that
      # ship, not through `make check-site-compile` (its $(BIN) prerequisite
      # rebuilt ./toke).  Same guards as that target.
      - name: Website examples compile under the release compiler
        run: |
          U="$RUNNER_TEMP/unpacked"; mkdir -p "$U"
          tar xzf "$TARBALL" -C "$U"
          T="$(ls -d "$U"/tkc-*/tkc)"
          "$T" --version
          V=.site/scripts/verify_site_examples.py
          if [ ! -f "$V" ]; then echo "SKIP: $V not found"
          elif ! grep -q -- '--compile-only' "$V"; then echo "SKIP: the site predates --compile-only (132.43)"
          else TKC="$T" python3 "$V" --check --compile-only
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tkc-${{ matrix.target }}
          path: ${{ env.TARBALL }}
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # SBOM + signing + release: runs once on Linux after all builds succeed
  # ────────────────────────────────────────────────────────────────────────────
  # 127.453: the SBOMs and signatures cover EXACTLY the published archives --
  # the four tarballs the build jobs of this run uploaded -- and checksums.txt.
  # Through 3.2.0 this job rebuilt tkc on ubuntu-latest and signed and
  # SBOM'd that rebuild, which is in none of the archives.
  #
  # Guards: nothing is published, uploaded to a release or tagged unless the
  # ref is refs/tags/v* (each such step carries its own `if:`).  Signing runs
  # on a tag, or on a manual run that asks for it (sign_test); never on a
  # pull request.
  release:
    name: SBOM, signing, and release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write      # needed by softprops/action-gh-release to create releases
      id-token: write      # needed by cosign keyless signing (OIDC token exchange)
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign_test) }}
      # The identity a verifier pins: this workflow, at this ref.
      CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
      CERT_ISSUER: https://token.actions.githubusercontent.com

    steps:
      # ── The archives the build jobs uploaded ────────────────────────────
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: tkc-*
          merge-multiple: true

      - name: Exactly the four platform archives
        working-directory: dist
        run: |
          ls -la
          n="$(ls tkc-*.tar.gz | wc -l)"
          test "$n" -eq 4 || { echo "expected 4 archives, found $n" >&2; exit 1; }
          for t in linux-x86_64 linux-arm64 macos-arm64 macos-x86_64; do
            ls tkc-*-"$t".tar.gz >/dev/null || { echo "no $t archive" >&2; exit 1; }
          done

      # ── SBOM, one per archive ──────────────────────────────────────────────
      # 127.439: pinned (installer script and binary from the same tag);
      # `syft packages` is deprecated in favour of `syft scan`.
      - name: Install syft
        run: |
          v=v1.57.1
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${v}/install.sh" \
            | sh -s -- -b /usr/local/bin "${v}"
          syft version

      # syft's file source unpacks an archive and catalogs its contents (the
      # binary, the stdlib C sources, the vendored cmark/tomlc99/miniz).
      - name: Generate an SPDX SBOM for each archive
        working-directory: dist
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          for t in tkc-*.tar.gz; do
            syft scan "file:$t" -o spdx-json > "$t.spdx.json"
            printf '%s: %s packages, %s files\n' "$t.spdx.json" \
              "$(jq '.packages | length' "$t.spdx.json")" "$(jq '(.files // []) | length' "$t.spdx.json")"
          done

      - name: Compute checksums
        working-directory: dist
        run: |
          sha256sum tkc-*.tar.gz tkc-*.tar.gz.spdx.json > checksums.txt
          cat checksums.txt

      # ── Signing (cosign keyless via GitHub Actions OIDC) ──────────────────
      - name: Install cosign
        if: env.SIGN == 'true'
        uses: sigstore/cosign-installer@v3.10.1
        with:
          cosign-release: 'v2.6.1'

      # 127.439: --bundle writes the bundle (signature, certificate and Rekor
      # entry) that `verify-blob --bundle` reads; a bare `sign-blob > x.sig`
      # cannot be verified that way.  Each archive, and checksums.txt (which
      # also covers the SBOMs), gets its own bundle: <file>.cosign.bundle.
      - name: Sign each archive and checksums.txt (keyless)
        if: env.SIGN == 'true'
        working-directory: dist
        run: |
          for f in tkc-*.tar.gz checksums.txt; do
            cosign sign-blob --yes --bundle "$f.cosign.bundle" "$f"
          done

      # ── Verification and tamper test ───────────────────────────────────────
      # Positive control first (127.439): each untampered file must verify
      # with the published command, or a rejection of a tampered one proves
      # nothing.  Then one appended byte must make each one fail.
      - name: Verify each bundle, then the tamper test
        if: env.SIGN == 'true'
        working-directory: dist
        run: |
          echo "identity: $CERT_IDENTITY"
          for f in tkc-*.tar.gz checksums.txt; do
            cosign verify-blob --bundle "$f.cosign.bundle" \
              --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$CERT_ISSUER" "$f"
            cp "$f" "$RUNNER_TEMP/tampered"
            echo "x" >> "$RUNNER_TEMP/tampered"
            if cosign verify-blob --bundle "$f.cosign.bundle" \
                 --certificate-identity "$CERT_IDENTITY" \
                 --certificate-oidc-issuer "$CERT_ISSUER" "$RUNNER_TEMP/tampered" 2>/dev/null; then
              echo "ERROR: cosign accepted a tampered $f" >&2
              exit 1
            fi
            echo "Tamper test passed: tampered $f correctly rejected."
            rm "$RUNNER_TEMP/tampered"
          done
          # The documented checksum route: checksums.txt verified above, then
          # every archive and SBOM against it.
          sha256sum -c checksums.txt

      # A run that does not publish keeps the set it built for inspection.
      - name: Keep the unpublished release set (not a tag)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: release-set-unpublished
          path: dist/
          retention-days: 1

      # ── Publish GitHub release ────────────────────────────────────────────
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tkc-*.tar.gz
            dist/tkc-*.tar.gz.spdx.json
            dist/tkc-*.tar.gz.cosign.bundle
            dist/checksums.txt
            dist/checksums.txt.cosign.bundle
          body: |
            ## tkc ${{ github.ref_name }}

            ### Platform binaries

            | File | Platform |
            |------|----------|
            | `tkc-${{ github.ref_name }}-linux-x86_64.tar.gz` | Linux x86-64 |
            | `tkc-${{ github.ref_name }}-linux-arm64.tar.gz` | Linux ARM64 |
            | `tkc-${{ github.ref_name }}-macos-arm64.tar.gz` | macOS ARM64 (Apple Silicon) |
            | `tkc-${{ github.ref_name }}-macos-x86_64.tar.gz` | macOS x86-64 (Intel) |
            | `<archive>.spdx.json` | SPDX SBOM of that archive |
            | `<archive>.cosign.bundle` | cosign keyless signature bundle of that archive |
            | `checksums.txt` (+ `.cosign.bundle`) | SHA-256 of every archive and SBOM, signed |

            ### Install

            ```sh
            tar xzf tkc-${{ github.ref_name }}-linux-x86_64.tar.gz
            cd tkc-${{ github.ref_name }}-linux-x86_64
            ./tkc --version
            ```

            ### Each tarball contains

            - `tkc` — the compiler binary
            - `src/stdlib/` — C sources needed for linking user programs
            - `stdlib/*.tki` — interface files for standard library modules
            - `stdlib/vendor/` — vendored cmark, tomlc99 and miniz sources
            - `LICENSE`, `NOTICE`, `LICENSING.md`, `stdlib/LICENSE` (MIT, the standard library)

            ### Verifying a download

            Each archive is signed as published. See [docs/security/release-signing.md](https://github.com/${{ github.repository }}/blob/main/docs/security/release-signing.md) for the full instructions.

            ```sh
            cosign verify-blob \
              --bundle tkc-${{ github.ref_name }}-linux-x86_64.tar.gz.cosign.bundle \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              tkc-${{ github.ref_name }}-linux-x86_64.tar.gz
            ```

            Or verify `checksums.txt` the same way (with `checksums.txt.cosign.bundle`), then `sha256sum -c --ignore-missing checksums.txt`.
