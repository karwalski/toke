name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write      # needed by softprops/action-gh-release to create releases
  id-token: write      # needed by cosign keyless signing (OIDC token exchange)

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Build matrix: compile tkc on every target platform and package release
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - target: macos-arm64
            runner: macos-14
            os: macos
            arch: arm64
          - target: macos-x86_64
            runner: macos-13
            os: macos
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Conformance gate
        run: make conform

      - name: Build release binary
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.head_commit.timestamp && '0' || '0' }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          make CFLAGS="-std=c99 -D_GNU_SOURCE -O2 -DNDEBUG -Wall -Wextra -Wpedantic -Werror -Wno-misleading-indentation -DTKC_STDLIB_DIR='\"./src/stdlib\"'"

      - name: Package release tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGING="tkc-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "${STAGING}/src/stdlib"
          mkdir -p "${STAGING}/stdlib/vendor"

          # Compiler binary
          cp toke "${STAGING}/tkc"
          chmod +x "${STAGING}/tkc"

          # stdlib C sources (needed for linking user programs)
          cp src/stdlib/*.c src/stdlib/*.h "${STAGING}/src/stdlib/" 2>/dev/null || true

          # stdlib .tki interface files
          cp stdlib/*.tki "${STAGING}/stdlib/" 2>/dev/null || true

          # Vendor sources (cmark, tomlc99)
          cp -r stdlib/vendor/cmark "${STAGING}/stdlib/vendor/"
          cp -r stdlib/vendor/tomlc99 "${STAGING}/stdlib/vendor/"

          # LICENSE
          cp LICENSE "${STAGING}/"

          tar czf "${STAGING}.tar.gz" "${STAGING}"
          echo "TARBALL=${STAGING}.tar.gz" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=tkc-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tkc-${{ matrix.target }}
          path: ${{ env.TARBALL }}
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # SBOM + signing + release: runs once on Linux after all builds succeed
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: SBOM, signing, and release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Rebuild binary for signing
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          make CFLAGS="-std=c99 -D_GNU_SOURCE -O2 -DNDEBUG -Wall -Wextra -Wpedantic -Werror -Wno-misleading-indentation -DTKC_STDLIB_DIR='\"./src/stdlib\"'"

      # ── SBOM ──────────────────────────────────────────────────────────────
      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SPDX SBOM
        run: syft packages file:./tkc -o spdx-json > tkc-sbom.spdx.json

      - name: Compute SBOM checksum
        run: sha256sum tkc-sbom.spdx.json > tkc-sbom.spdx.json.sha256

      # ── Binary signing (cosign keyless via GitHub Actions OIDC) ───────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binary (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign-blob --yes tkc > tkc.sig

      # ── Tamper-detection test ─────────────────────────────────────────────
      - name: Tamper test
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cp tkc tkc-tampered
          echo "x" >> tkc-tampered
          if cosign verify-blob \
               --bundle tkc.sig \
               --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
               --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
               tkc-tampered 2>/dev/null; then
            echo "ERROR: cosign accepted a tampered binary" >&2
            exit 1
          fi
          echo "Tamper test passed: tampered binary correctly rejected."
          rm tkc-tampered

      # ── Download all platform tarballs ──────────────────────────────────
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Compute checksums
        working-directory: release-artifacts
        run: sha256sum tkc-*.tar.gz > checksums.txt

      # ── Publish GitHub release ────────────────────────────────────────────
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/tkc-*.tar.gz
            release-artifacts/checksums.txt
            tkc-sbom.spdx.json
            tkc-sbom.spdx.json.sha256
            tkc.sig
          body: |
            ## tkc ${{ github.ref_name }}

            ### Platform binaries

            | File | Platform |
            |------|----------|
            | `tkc-${{ github.ref_name }}-linux-x86_64.tar.gz` | Linux x86-64 |
            | `tkc-${{ github.ref_name }}-linux-arm64.tar.gz` | Linux ARM64 |
            | `tkc-${{ github.ref_name }}-macos-arm64.tar.gz` | macOS ARM64 (Apple Silicon) |
            | `tkc-${{ github.ref_name }}-macos-x86_64.tar.gz` | macOS x86-64 (Intel) |
            | `checksums.txt` | SHA-256 checksums for all tarballs |
            | `tkc-sbom.spdx.json` | Software Bill of Materials (SPDX) |
            | `tkc.sig` | cosign keyless signature bundle |

            ### Install

            ```sh
            tar xzf tkc-${{ github.ref_name }}-linux-x86_64.tar.gz
            cd tkc-${{ github.ref_name }}-linux-x86_64
            ./tkc --version
            ```

            ### Each tarball contains

            - `tkc` — the compiler binary
            - `src/stdlib/` — C sources needed for linking user programs
            - `stdlib/*.tki` — interface files for standard library modules
            - `stdlib/vendor/` — vendored cmark and tomlc99 sources
            - `LICENSE`

            ### Verifying the binary

            See [docs/security/release-signing.md](https://github.com/${{ github.repository }}/blob/main/docs/security/release-signing.md) for full instructions.

            ```sh
            cosign verify-blob \
              --bundle tkc.sig \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              tkc-${{ github.ref_name }}-linux-x86_64/tkc
            ```
