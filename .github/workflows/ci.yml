name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev llvm-dev clang

      - name: Build tkc
        run: make

      # 127.166: C031/C032 read fixtures written by openpyxl / reportlab /
      # pikepdf / Pillow. Without them they SKIP (exit 0, counted as skipped);
      # here they are installed and TKC_CONFORM_NO_SKIP=1 makes a skip fail.
      - name: Python libraries for C031/C032
        run: |
          python3 -m venv "$RUNNER_TEMP/tkpy"
          "$RUNNER_TEMP/tkpy/bin/pip" install --quiet openpyxl reportlab pikepdf pillow
          echo "TKC_PY=$RUNNER_TEMP/tkpy/bin/python" >> "$GITHUB_ENV"
          echo "TKC_CONFORM_NO_SKIP=1" >> "$GITHUB_ENV"

      - name: Conformance suite
        run: make conform

      - name: Verify LLVM IR (llvm-as + opt -verify)
        run: make verify-ir

  # Story 132.41. Until this job existed, every gate below was a LOCAL `make`
  # target: `make ci` ran them, this workflow did not, and nothing on a push or
  # a pull request ever read them. The documentation gate in particular
  # compiles AND LINKS 437 full-program ```toke blocks out of the canonical
  # docs — the one check in the project that can prove a documented call
  # reaches a symbol that exists — and it had never run automatically once.
  #
  # Each step here runs its own negative control FIRST where the gate has one
  # (`--self-test` / `--selftest`), so a green tick means "the gate was watched
  # to reject a deliberately broken input, then found nothing", not "the gate
  # ran". A gate nobody has watched fail is not a gate; seven checks audited on
  # 2026-09-20 reported success while testing nothing, and this one step would
  # have caught every one of them.
  docs-and-claims:
    name: Documentation and claim gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev llvm-dev clang

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build tkc
        run: make

      # Negative control, then the sweep. --self-test builds a program whose
      # only fault is a call to a function that exists nowhere and fails unless
      # the gate rejects it at link. Do not split these two steps apart.
      - name: Documentation examples compile and link
        run: make check-docs

      # 127.87: the shipped examples/ compile (nothing read them before).
      - name: Shipped examples compile
        run: make check-examples

      # Every diagnostic the compiler emits is documented, and errors.md lists
      # no dead code.
      - name: Diagnostic codes are documented
        run: make check-error-codes

      # The pattern catalogue's generated docs match the catalogue.
      - name: Pattern catalogue is in sync
        run: make check-patterns

      # Every countable project-scale number is re-derived from the tree and
      # compared against docs/metrics-baseline.md and the compiler's own strings.
      - name: Project facts match the tree
        run: make check-facts

      # Claim guard 1 of 2: no published percentage without its TEMSpec §6.3
      # fields, no withdrawn headline restated, no tokenizer lane crossing.
      - name: Token-efficiency claims are qualified
        run: make check-metrics

      # Claim guard 2 of 2, with its --selftest negative control: the canonical
      # facts block has not drifted in any copy, and neither retired fact is back.
      - name: Canonical facts have not drifted
        run: make check-canonical

      # The same two guards across every sibling repo checked out beside this
      # one. On a GitHub runner none are, so this proves the runner works and
      # reports each skip by name; it is the local `make ci` that sweeps them
      # for real. Wiring the sibling checkouts in is story 132.46.
      # 132.68: resolving zero siblings now FAILS by default (a sweep that
      # finds nothing is not a pass); this runner says so on purpose.
      - name: Claim guards across sibling repos
        run: make check-claims-all CLAIMS_ALLOW_NO_SIBLINGS=1

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev clang cppcheck clang-tidy

      - name: make lint (compiler --analyze)
        run: make lint

      - name: cppcheck
        run: |
          cppcheck --enable=all \
                   --error-exitcode=1 \
                   --inline-suppr \
                   --template='{file}:{line}:{column}: {severity}: {message} [{id}]' \
                   src/

      - name: clang-tidy
        run: |
          clang-tidy src/*.c -- \
            -std=c99 -Wall -Wextra -Wpedantic -Werror -g

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check .tki/C coverage
        run: make check-tki

  repro:
    name: Reproducible build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Pin SOURCE_DATE_EPOCH to commit timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Verify reproducible build
        run: make repro-check

  # ══════════════════════════════════════════════════════════════════════════
  # Story 123.8 — the gates `make ci` runs that CI did not
  #
  # `make ci` has 17 members. Before this change the workflow above ran 10 of
  # them. These are six of the other seven; the seventh, `conform-check`, is
  # `make conform` plus an echo and is skipped as a duplicate rather than run
  # twice. They are cheap, they were already green locally, and nothing on a
  # push or a pull request had ever read one.
  #
  # 127.143 closed the `diff-codegen` hole. It is the gate the corpus
  # programme calls its root of trust — the only check here that notices a
  # codegen change altering what a compiled program DOES — and it was a member
  # of neither `make ci` nor this workflow, so it had never run on a push.
  # Both now run it. Measured cost on an M4 Max with the binary already built:
  # 118 programs compiled and executed, 265 s. That is 4.4 minutes against a
  # `make ci` that already runs well over an hour, so cost was never the
  # reason it was out.
  # ══════════════════════════════════════════════════════════════════════════
  ci-gates:
    name: make ci gates missing from CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev llvm-dev clang

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build tkc
        run: make

      # 127.166: C031/C032 read fixtures written by openpyxl / reportlab /
      # pikepdf / Pillow. Without them they SKIP (exit 0, counted as skipped);
      # here they are installed and TKC_CONFORM_NO_SKIP=1 makes a skip fail.
      - name: Python libraries for C031/C032
        run: |
          python3 -m venv "$RUNNER_TEMP/tkpy"
          "$RUNNER_TEMP/tkpy/bin/pip" install --quiet openpyxl reportlab pikepdf pillow
          echo "TKC_PY=$RUNNER_TEMP/tkpy/bin/python" >> "$GITHUB_ENV"
          echo "TKC_CONFORM_NO_SKIP=1" >> "$GITHUB_ENV"

      # The shell-script conformance cases. test/conform/*.sh is 100+ scripts
      # that the build-and-test job's `make conform` also runs (conform is
      # scripts/conform_isolated.sh all: the YAML cases, then these). Run
      # explicitly so a failure is attributed to the right suite.
      - name: Shell conformance cases
        run: make conform-sh

      # Static analysis of the #else branch of every platform conditional.
      # Sibling of `make lint`, added by 135.3a, never run by CI.
      - name: Non-host platform branches build
        run: make lint-nonhost

      - name: Index is in sync
        run: make check-index

      - name: .tki names resolve
        run: make check-tki-names

      # A stdlib module whose glue returns a plausible value while the C core
      # beside it is a stub. 31 defects in Epic 136 had this shape.
      - name: Glue reaches a real core
        run: make check-glue-core

      # 136.50a — the reverse direction: a public C function no .tki exports
      # and nothing calls. Fails on an unclassified or stale finding; the
      # classified gap backlog is reported, not asserted.
      - name: Every unsurfaced C function is classified
        run: make check-core-reach

      # 136.56 — a tracked test source with no target and no caller.
      - name: Every test source is built by something
        run: make check-test-orphans

      # 123.10 — the eight 120.22 fuzz harnesses build and replay their seed
      # and adversarial corpora clean under ASAN+UBSAN. A replay, not a fuzz
      # run (that is security-nightly.yml); `auto` picks libFuzzer here.
      - name: Fuzz harnesses build and replay clean
        run: make CC=clang fuzz-smoke

      # 127.126 — the stdlib's own toke sources (m= files) type-check.
      - name: stdlib toke sources type-check
        run: make check-stdlib-tk

      # 132.43 — the website's published toke programs must compile under the
      # compiler this push built. The website only checked them on a push to
      # the website, so a compiler-side change (stdlib/io.tki making io.printi
      # an error) broke them silently and shipped in v3.0.0.
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          repository: karwalski/toke-web
          path: .site

      - name: Website examples compile under this compiler
        run: make SITE_REPO=.site check-site-compile

      - name: No parallel stdlib descriptions
        run: make check-parallel-stdlib

      # 127.143 — the root-of-trust gate. Compiles AND RUNS every full program
      # under test/standalone, test/e2e and test/codegen and diffs
      # (compiled, exit code, stdout hash) against test/codegen-baseline.json.
      # No `continue-on-error`: a step that cannot fail is not a gate. If this
      # is red, either a codegen change altered behaviour, or the baseline is
      # stale and the change was intended — in which case re-record it with
      # `make diff-codegen-record` in the commit that made the change, never
      # in a separate tidy-up.
      - name: Codegen behaviour unchanged (root of trust)
        run: make diff-codegen

  # ══════════════════════════════════════════════════════════════════════════
  # Story 123.8 — the test families no PR job has ever run
  #
  # Verbatim, the complete set of things the pull-request workflow ran before
  # 2026-09-24: `make`, `make conform`, `make verify-ir`, `make lint`,
  # cppcheck, clang-tidy, `make check-tki`, `make repro-check`, and the seven
  # claim/doc gates in the docs-and-claims job. Not one `test-*` target.
  #
  # The cost of that: four test-stdlib-http* rules had been unable to LINK for
  # long enough that nobody knew, along with test-stdlib-log,
  # test-stdlib-coverage and test-stdlib-viz-integration. All seven are fixed
  # in the same change that adds this job, because wiring a broken target into
  # CI turns CI red for a reason nobody understands.
  #
  # TEST_CI_GREEN was MEASURED, target by target, on a clean tree before any
  # of it was wired in: 57 of 72 passed. See the Makefile for the survey and
  # for the two lists of what is NOT here and why.
  # ══════════════════════════════════════════════════════════════════════════
  stdlib-tests:
    name: stdlib and integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev llvm-dev clang libsqlite3-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build tkc
        run: make

      # NOTE FOR THE FIRST RUN OF THIS JOB. The green list was measured on
      # macOS/arm64 and this runner is Linux/x86-64, so a macOS-green target
      # is evidence about macOS. This first run IS the Linux measurement.
      # Anything red here belongs in TEST_CI_KNOWN_RED with a story number
      # saying what is broken — not quietly deleted from the green list.
      - name: Test targets measured green
        run: make test-ci-green

      # Allowed to fail, and it will. These are the targets measured RED at
      # HEAD on 2026-09-24, listed with their reasons in the Makefile. They
      # run so that the failures stay visible and so a target that starts
      # passing can be promoted — the alternative is the four unlinkable http
      # rules again.
      - name: Test targets known red (allowed to fail)
        continue-on-error: true
        run: |
          echo "::warning::These targets are KNOWN RED at HEAD. This step is"
          echo "::warning::allowed to fail. It is not a pass, and a green tick"
          echo "::warning::on this job does not mean these succeeded. See"
          echo "::warning::TEST_CI_KNOWN_RED in the Makefile for each reason."
          make test-ci-known-red

      # 136.56 — wired and never measured anywhere (see TEST_CI_UNMEASURED
      # in the Makefile). This run is their first measurement; allowed to
      # fail until it has been read and each one promoted or demoted.
      - name: Test targets not yet measured (allowed to fail)
        continue-on-error: true
        run: |
          echo "::warning::UNMEASURED targets. Allowed to fail; a green tick"
          echo "::warning::here is not a pass. See TEST_CI_UNMEASURED."
          make test-ci-unmeasured

  # ══════════════════════════════════════════════════════════════════════════
  # Story 123.9 (folds 122.1) — sanitizers and exploit-mitigation flags
  #
  # ZERO sanitizers ran on a pull request before 2026-09-24, and the shipping
  # build carried no hardening flags at all.
  # ══════════════════════════════════════════════════════════════════════════
  hardening:
    name: Exploit-mitigation flags are in effect
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev llvm-dev clang binutils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build tkc (hardened — this is the default build)
        run: make

      # BLOCKING, and it is a real gate: it compiles behavioural probes with
      # the actual CFLAGS and runs its own two negative controls FIRST, so a
      # green tick means the probes were watched to catch an unprotected
      # build and then found nothing.
      #
      # This job matters more than the local one. -D_FORTIFY_SOURCE=3 is
      # INERT on macOS — Apple's SDK has levels 1 and 2 only — so a developer
      # Mac cannot tell you whether level 3 works. glibc can, and this runner
      # is where that claim is either earned or not. Read the gate's
      # "Reported, not asserted" lines; they say which level is really on.
      - name: make check-hardening
        run: make check-hardening

  sanitizers:
    name: ASAN + UBSAN
    runs-on: ubuntu-latest

    # ┌──────────────────────────────────────────────────────────────────────┐
    # │ THIS JOB IS NON-BLOCKING, ON PURPOSE, AND THAT IS A PROBLEM TO FIX   │
    # │ RATHER THAN A SETTING TO LEAVE ALONE.                                │
    # │                                                                      │
    # │ It is `continue-on-error` because nothing had ever run a sanitizer   │
    # │ here and the first run's job is to tell us what is in the tree, not  │
    # │ to block every pull request on a backlog none of them created.      │
    # │                                                                      │
    # │ It is declared here, in the workflow, rather than arranged quietly   │
    # │ by disabling checks or adding suppressions, so that "this job is     │
    # │ allowed to fail" is a fact you can read instead of infer. A green    │
    # │ tick on this job does NOT mean the sanitizers found nothing.        │
    # │                                                                      │
    # │ Remove continue-on-error once the findings are at zero. Do not make  │
    # │ it green by narrowing what it checks.                                │
    # └──────────────────────────────────────────────────────────────────────┘
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev llvm-dev clang libsqlite3-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Say plainly what a tick on this job means
        run: |
          echo "::warning::The ASAN+UBSAN job is continue-on-error. A green"
          echo "::warning::tick here means the job RAN, not that it found"
          echo "::warning::nothing. Read the step output."

      # The negative control, first and unconditionally: a planted
      # heap-use-after-free that this exact build configuration must catch.
      # Without it, "0 findings" and "the instrumentation never made it into
      # the binary" are the same output. Both test-asan targets depend on it,
      # so it cannot be skipped; it is a separate step here only so that a
      # failure is attributed to the control rather than to the tree.
      - name: Sanitizer self-test (must catch a planted use-after-free)
        run: make CC=clang asan-selftest

      - name: ASAN + UBSAN — stdlib C unit tests
        run: make CC=clang test-asan-stdlib

      - name: ASAN + UBSAN — tkc through the conformance suite
        run: make CC=clang test-asan-compiler

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    # Non-blocking for the same reason and on the same terms as the sanitizer
    # job above: there was no coverage measurement at all before this, so the
    # floor is a measurement of the tree rather than a target anyone has
    # agreed to. Make it blocking in the change that sets a floor with intent
    # behind it.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev llvm-dev clang llvm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Say plainly what a tick on this job means
        run: |
          echo "::warning::The coverage job is continue-on-error. A green tick"
          echo "::warning::means it ran. COVERAGE_MIN is a measurement of the"
          echo "::warning::tree, not an agreed target."

      - name: make check-coverage
        run: make CC=clang check-coverage
