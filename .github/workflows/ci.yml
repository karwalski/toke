name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev llvm-dev clang

      - name: Build tkc
        run: make

      - name: Conformance suite
        run: make conform

      - name: Verify LLVM IR (llvm-as + opt -verify)
        run: make verify-ir

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev clang cppcheck clang-tidy

      - name: make lint (compiler --analyze)
        run: make lint

      - name: cppcheck
        run: |
          cppcheck --enable=all \
                   --error-exitcode=1 \
                   --inline-suppr \
                   --template='{file}:{line}:{column}: {severity}: {message} [{id}]' \
                   src/

      - name: clang-tidy
        run: |
          clang-tidy src/*.c -- \
            -std=c99 -Wall -Wextra -Wpedantic -Werror -g

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check .tki/C coverage
        run: make check-tki

  repro:
    name: Reproducible build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Pin SOURCE_DATE_EPOCH to commit timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Verify reproducible build
        run: make repro-check
